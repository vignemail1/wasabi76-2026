<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Wasabi76, restaurant japonais à Sotteville-lès-Rouen. Découvrez notre carte et nos horaires.">
    <title>Wasabi76 — Restaurant japonais</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#accueil" aria-label="Wasabi76, accueil">Wasabi76</a>
      <nav class="main-nav" aria-label="Navigation principale">
        <a href="#carte">La carte</a>
        <a href="#horaires">Horaires</a>
        <a href="#contact">Nous trouver</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="accueil" aria-labelledby="page-title">
        <p class="eyebrow">Cuisine japonaise</p>
        <h1 id="page-title">Wasabi76, restaurant japonais</h1>
        <p>Découvrez notre carte et retrouvez-nous à Sotteville-lès-Rouen.</p>
        <a class="button" href="#carte">Voir la carte</a>
      </section>

      <section class="menu-section" id="carte" aria-labelledby="menu-title">
        <h2 id="menu-title">Notre carte</h2>
        <div id="menu-content" aria-live="polite">
          <p>Chargement de la carte…</p>
        </div>
      </section>

      <section class="info-section" id="horaires" aria-labelledby="hours-title">
        <h2 id="hours-title">Horaires d’ouverture</h2>
        <div id="hours-content"></div>
      </section>

      <section class="info-section" id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">Nous trouver</h2>
        <div id="contact-content"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p><a href="https://www.wasabi76.fr">www.wasabi76.fr</a></p>
    </footer>

    <script src="menu.js"></script>
    <script src="site.js"></script>
    <script src="app.js"></script>
  </body>
</html>
